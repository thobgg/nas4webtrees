# nas4webtrees — das originale webtrees mit api4webtrees für wtAnd, wtWin und wtTux.
# Für TrueNAS, UGREEN, TerraMaster, Asustor (Portainer), Unraid (Compose), QNAP (Container Station),
# Raspberry Pi und jeden Linux-Server mit Docker.
#
# Anpassen höchstens: den Port links vom Doppelpunkt und die beiden Ordner links vom Doppelpunkt.
# Danach webtrees im Browser aufrufen (http://<NAS>:8095) und die kurze Einrichtungsseite ausfüllen:
# Name des Stammbaums, dein Konto, fertig. Keine Datenbank, kein Passwort in dieser Datei.
services:
  webtrees:
    image: ghcr.io/thobgg/nas4webtrees:latest
    container_name: webtrees
    restart: unless-stopped
    ports:
      - "8095:80"
    volumes:
      - ./webtrees:/webtrees        # Programm und Daten; webtrees aktualisiert sich hier selbst
      - ./backup:/backup            # nächtliche Sicherung: GEDCOM, Datenbank, Fotos; import/
    environment:
      TZ: Europe/Berlin
      # Auf Unraid u. ä.: Besitzer der Dateien
      # PUID: "99"
      # PGID: "100"
      # Für Profis: Einrichtung ohne Browser beim ersten Start (siehe README, „Settings“), z. B.
      # WT_USER: admin
      # WT_EMAIL: ich@example.org
      # WT_PASS_FILE: /run/secrets/webtrees_admin
