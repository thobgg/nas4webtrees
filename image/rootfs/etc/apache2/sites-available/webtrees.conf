<VirtualHost *:80>
    DocumentRoot "/webtrees"
    <Directory "/webtrees">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # Das Datenverzeichnis nie ausliefern — zusätzlich zur .htaccess, die webtrees dort anlegt.
    <Directory "/webtrees/data">
        Require all denied
    </Directory>

    # Einrichtung im Browser (/opt/nas4webtrees/setup): Solange webtrees nicht eingerichtet ist und
    # der Einstieg die eigene Seite eingeschaltet hat (keine Vorgaben per Umgebung oder setup.json),
    # landet jeder Aufruf dort statt im Assistenten von webtrees. Ausgenommen: die statischen Dateien
    # (Gesundheitsprüfung) und der Nebenprozess selbst, der den Assistenten über 127.0.0.1 ausfüllt.
    Alias /nas4webtrees-setup /opt/nas4webtrees/setup
    <Directory "/opt/nas4webtrees/setup">
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond /run/nas4webtrees/setup-page -f
    RewriteCond /webtrees/data/config.ini.php !-f
    RewriteCond %{REMOTE_ADDR} !^127\.0\.0\.1$
    RewriteCond %{REQUEST_URI} !^/(public|nas4webtrees-setup)/
    RewriteRule ^ /nas4webtrees-setup/index.php [PT,L]

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
