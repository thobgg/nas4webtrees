<VirtualHost *:80>
    DocumentRoot "/webtrees"
    <Directory "/webtrees">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # Das Datenverzeichnis nie ausliefern — zusätzlich zur .htaccess, die webtrees dort anlegt.
    <Directory "/webtrees/data">
        Require all denied
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
