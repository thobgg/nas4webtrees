# Reverse Proxy der NAS (außen HTTPS, innen HTTP): Ohne diese Zeile hält webtrees jeden Aufruf
# für HTTP und erzeugt http://-Links, die der Browser auf einer HTTPS-Seite blockiert. Ein
# LAN-Client kann den Kopf fälschen — mehr als https-Links für sich selbst bekommt er davon nicht.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
ServerName webtrees
ServerTokens Prod
ServerSignature Off
